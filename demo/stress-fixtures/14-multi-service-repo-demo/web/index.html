<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Multi-Service Demo</title></head>
  <body>
    <main id="app">
      <h1>Submit a job</h1>
      <form id="f"><input name="text" placeholder="text"><button>Submit</button></form>
      <pre id="out"></pre>
    </main>
    <script>
      document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = e.target.text.value;
        const r = await fetch('/jobs', { method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({ text }) });
        document.getElementById('out').textContent = await r.text();
      });
    </script>
  </body>
</html>
