<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="MatrixOmnix roadmap: what is shipped today vs planned for the hosted phase.">
  <rect width="1200" height="900" fill="#fff"/>
  <rect x="56" y="56" width="1088" height="788" fill="#f7f7f7" stroke="#111" stroke-width="4"/>

  <defs>
    <marker id="rmArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
    <marker id="rmArrowDim" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#111" opacity="0.5"/>
    </marker>
  </defs>

  <text x="100" y="124" font-family="Inter,Arial" font-size="40" font-weight="900" fill="#111">Roadmap</text>
  <text x="100" y="156" font-family="Inter,Arial" font-size="17" font-weight="500" fill="#111" opacity="0.7">Solid black = shipped today · Dashed = planned · Hatched grey = explicitly not in scope yet</text>

  <!-- Section: Shipped today (left column) -->
  <text x="100" y="212" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#111" letter-spacing="2" opacity="0.55">SHIPPED TODAY</text>

  <g font-family="Inter,Arial" font-weight="800" fill="#111">
    <!-- Local CLI (MatrixOmnix) -->
    <rect x="100" y="232" width="320" height="104" fill="#111"/>
    <text x="260" y="270" text-anchor="middle" font-size="22" fill="#fff">Local CLI · MatrixOmnix</text>
    <text x="260" y="296" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" opacity="0.75">analyze · gap · iterate · qa:regression</text>
    <text x="260" y="316" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" opacity="0.75">14/14 stress fixtures reach product-ready</text>

    <!-- Sibling: d2p minimal -->
    <rect x="100" y="358" width="320" height="104" fill="#111"/>
    <text x="260" y="396" text-anchor="middle" font-size="22" fill="#fff">Sibling · d2p (~2.5k LOC)</text>
    <text x="260" y="422" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" opacity="0.75">pure-agent loop · MiniMax / Claude / Codex</text>
    <text x="260" y="442" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" opacity="0.75">github.com/Hosico02/d2p</text>

    <!-- Evidence reports + gates -->
    <rect x="100" y="484" width="320" height="104" fill="#111"/>
    <text x="260" y="522" text-anchor="middle" font-size="22" fill="#fff">Evidence + Gates</text>
    <text x="260" y="548" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" opacity="0.75">tests / build / gap / score gate</text>
    <text x="260" y="568" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" opacity="0.75">evidence-weighted scoring · audit trail</text>

    <!-- Web research + advisory (opt-in) -->
    <rect x="100" y="610" width="320" height="104" fill="#111"/>
    <text x="260" y="648" text-anchor="middle" font-size="22" fill="#fff">Web Research + Advisory</text>
    <text x="260" y="674" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" opacity="0.75">opt-in --web · DuckDuckGo · multi-domain</text>
    <text x="260" y="694" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" opacity="0.75">4 advisory critics with cited sources</text>
  </g>

  <!-- Section: Planned (middle column) -->
  <text x="500" y="212" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#111" letter-spacing="2" opacity="0.55">PLANNED</text>

  <g font-family="Inter,Arial" font-weight="800" fill="#111">
    <rect x="500" y="232" width="320" height="104" fill="#fff" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="660" y="270" text-anchor="middle" font-size="22">Managed Workspace</text>
    <text x="660" y="296" text-anchor="middle" font-size="12" font-weight="500" opacity="0.7">hosted runs · isolation · queueing</text>
    <text x="660" y="316" text-anchor="middle" font-size="12" font-weight="500" opacity="0.7">artifact storage · billing boundary</text>

    <rect x="500" y="358" width="320" height="104" fill="#fff" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="660" y="396" text-anchor="middle" font-size="22">Team Review</text>
    <text x="660" y="422" text-anchor="middle" font-size="12" font-weight="500" opacity="0.7">role-based approval · audit log</text>
    <text x="660" y="442" text-anchor="middle" font-size="12" font-weight="500" opacity="0.7">human-in-the-loop sign-off</text>

    <rect x="500" y="484" width="320" height="104" fill="#fff" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="660" y="522" text-anchor="middle" font-size="22">Long-horizon Runs</text>
    <text x="660" y="548" text-anchor="middle" font-size="12" font-weight="500" opacity="0.7">scheduled multi-day iterations</text>
    <text x="660" y="568" text-anchor="middle" font-size="12" font-weight="500" opacity="0.7">drift detection · automatic rollback</text>

    <rect x="500" y="610" width="320" height="104" fill="#fff" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="660" y="648" text-anchor="middle" font-size="22">Cross-project Memory</text>
    <text x="660" y="674" text-anchor="middle" font-size="12" font-weight="500" opacity="0.7">QA cases transfer across projects</text>
    <text x="660" y="694" text-anchor="middle" font-size="12" font-weight="500" opacity="0.7">archetype standards from corpus</text>
  </g>

  <!-- Section: Not in scope (right column) -->
  <text x="900" y="212" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#111" letter-spacing="2" opacity="0.55">NOT IN SCOPE (YET)</text>

  <g font-family="Inter,Arial" font-weight="800" fill="#111">
    <pattern id="hatch" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#111" stroke-width="1.5" opacity="0.18"/>
    </pattern>

    <rect x="900" y="232" width="180" height="104" fill="url(#hatch)" stroke="#111" stroke-width="2" opacity="0.85"/>
    <text x="990" y="276" text-anchor="middle" font-size="18">Upload &amp; Run</text>
    <text x="990" y="300" text-anchor="middle" font-size="11" font-weight="500" opacity="0.7">hosted intake of demo</text>
    <text x="990" y="318" text-anchor="middle" font-size="11" font-weight="500" opacity="0.7">archives via the site</text>

    <rect x="900" y="358" width="180" height="104" fill="url(#hatch)" stroke="#111" stroke-width="2" opacity="0.85"/>
    <text x="990" y="402" text-anchor="middle" font-size="18">Artifact ZIPs</text>
    <text x="990" y="426" text-anchor="middle" font-size="11" font-weight="500" opacity="0.7">downloadable</text>
    <text x="990" y="444" text-anchor="middle" font-size="11" font-weight="500" opacity="0.7">productized bundles</text>

    <rect x="900" y="484" width="180" height="104" fill="url(#hatch)" stroke="#111" stroke-width="2" opacity="0.85"/>
    <text x="990" y="528" text-anchor="middle" font-size="18">Auto-deploy</text>
    <text x="990" y="552" text-anchor="middle" font-size="11" font-weight="500" opacity="0.7">to user's</text>
    <text x="990" y="570" text-anchor="middle" font-size="11" font-weight="500" opacity="0.7">infrastructure</text>

    <rect x="900" y="610" width="180" height="104" fill="url(#hatch)" stroke="#111" stroke-width="2" opacity="0.85"/>
    <text x="990" y="654" text-anchor="middle" font-size="18">Product</text>
    <text x="990" y="676" text-anchor="middle" font-size="11" font-weight="500" opacity="0.7">"ready" badge</text>
    <text x="990" y="694" text-anchor="middle" font-size="11" font-weight="500" opacity="0.7">without human review</text>
  </g>

  <!-- Arrows connecting shipped column to planned column (where directional) -->
  <g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 284 L 500 284" marker-end="url(#rmArrow)"/>
    <path d="M420 410 L 500 410" marker-end="url(#rmArrow)" opacity="0.55" stroke-dasharray="6 4"/>
    <path d="M420 536 L 500 536" marker-end="url(#rmArrow)" opacity="0.55" stroke-dasharray="6 4"/>
    <path d="M420 662 L 500 662" marker-end="url(#rmArrow)" opacity="0.55" stroke-dasharray="6 4"/>
  </g>

  <!-- Legend -->
  <g font-family="Inter,Arial" font-size="14" font-weight="500" fill="#111">
    <rect x="100" y="772" width="22" height="22" fill="#111"/>
    <text x="132" y="789">shipped today</text>
    <rect x="280" y="772" width="22" height="22" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="312" y="789">planned</text>
    <rect x="430" y="772" width="22" height="22" fill="url(#hatch)" stroke="#111" stroke-width="1.5" opacity="0.85"/>
    <text x="462" y="789">explicitly not in scope yet</text>
  </g>
</svg>
