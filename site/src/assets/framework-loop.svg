<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="MatrixOmnix multi-agent loop: Analyzer, Planner, Executor, Verifier, Reviewer, QA Memory, with optional Web Market Research and Advisory critics.">
  <rect width="1200" height="900" fill="#fff"/>
  <rect x="40" y="40" width="1120" height="820" fill="#f7f7f7" stroke="#111" stroke-width="4"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#111" opacity="0.6"/>
    </marker>
  </defs>

  <text x="80" y="100" font-family="Inter,Arial" font-size="36" font-weight="900" fill="#111">Multi-agent loop</text>
  <text x="80" y="134" font-family="Inter,Arial" font-size="18" font-weight="500" fill="#111" opacity="0.7">Analyzer → Planner → Executor → Verifier → Reviewer → QA Memory · with optional web research and advisory critics</text>

  <!-- center logo -->
  <circle cx="600" cy="480" r="120" fill="#111"/>
  <text x="600" y="464" text-anchor="middle" font-family="Inter,Arial" font-size="32" font-weight="800" fill="#fff">Matrix</text>
  <text x="600" y="504" text-anchor="middle" font-family="Inter,Arial" font-size="32" font-weight="800" fill="#fff">Omnix</text>

  <!-- 6 core agent boxes around the center, clockwise from 12 -->
  <g font-family="Inter,Arial" font-size="26" font-weight="800" fill="#111">
    <rect x="468" y="220" width="264" height="78" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="600" y="268" text-anchor="middle">Analyzer</text>

    <rect x="820" y="330" width="244" height="78" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="942" y="378" text-anchor="middle">Planner</text>

    <rect x="820" y="552" width="244" height="100" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="942" y="592" text-anchor="middle">Executor</text>
    <text x="942" y="624" text-anchor="middle" font-size="14" font-weight="500" fill="#111" opacity="0.65">parallel · N workers</text>

    <rect x="468" y="662" width="264" height="78" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="600" y="710" text-anchor="middle">Verifier</text>

    <rect x="136" y="552" width="244" height="78" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="258" y="600" text-anchor="middle">Reviewer</text>

    <rect x="136" y="330" width="244" height="100" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="258" y="370" text-anchor="middle">QA Memory</text>
    <text x="258" y="402" text-anchor="middle" font-size="14" font-weight="500" fill="#111" opacity="0.65">cases · cross-iteration</text>
  </g>

  <!-- core flow: directional arrows around the ring (clockwise) -->
  <g fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M736 268 C 800 280 850 296 824 338" marker-end="url(#arrow)"/>
    <path d="M996 412 C 1040 470 1040 500 996 548" marker-end="url(#arrow)"/>
    <path d="M888 656 C 820 692 760 706 736 706" marker-end="url(#arrow)"/>
    <path d="M464 706 C 380 700 320 686 312 656" marker-end="url(#arrow)"/>
    <path d="M204 548 C 158 488 158 460 204 416" marker-end="url(#arrow)"/>
    <path d="M312 330 C 380 286 460 264 466 262" marker-end="url(#arrow)"/>
  </g>

  <!-- external inputs (opt-in network) -->
  <g font-family="Inter,Arial" font-weight="800" fill="#111">
    <rect x="438" y="78" width="324" height="98" fill="#fff" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="600" y="118" text-anchor="middle" font-size="22">Web Market Research</text>
    <text x="600" y="144" text-anchor="middle" font-size="13" font-weight="500" fill="#111" opacity="0.7">opt-in --web · DuckDuckGo · multi-domain</text>
    <text x="600" y="162" text-anchor="middle" font-size="13" font-weight="500" fill="#111" opacity="0.7">capabilities + source URLs</text>

    <rect x="876" y="170" width="284" height="138" fill="#fff" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="1018" y="208" text-anchor="middle" font-size="22">Advisory Critics</text>
    <text x="1018" y="234" text-anchor="middle" font-size="13" font-weight="500" fill="#111" opacity="0.7">market_comparator · gap_critic</text>
    <text x="1018" y="254" text-anchor="middle" font-size="13" font-weight="500" fill="#111" opacity="0.7">planner_critic · reviewer_critic</text>
    <text x="1018" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#111" opacity="0.7">opt-in --advisory-agents</text>
    <text x="1018" y="296" text-anchor="middle" font-size="12" font-style="italic" fill="#111" opacity="0.55">can suggest, cannot pass gates</text>
  </g>

  <!-- dashed inputs from external to ring nodes -->
  <g fill="none" stroke="#111" stroke-width="4" stroke-dasharray="8 6" opacity="0.65">
    <path d="M600 176 L 600 220" marker-end="url(#arrow-dim)"/>
    <path d="M896 312 C 880 322 870 326 868 332" marker-end="url(#arrow-dim)"/>
  </g>

  <!-- legend -->
  <g font-family="Inter,Arial" font-size="14" font-weight="500" fill="#111">
    <line x1="80" y1="822" x2="124" y2="822" stroke="#111" stroke-width="5"/>
    <text x="134" y="827">core loop (every iteration)</text>
    <line x1="400" y1="822" x2="444" y2="822" stroke="#111" stroke-width="4" stroke-dasharray="8 6" opacity="0.65"/>
    <text x="454" y="827" opacity="0.75">opt-in network inputs</text>
  </g>
</svg>
